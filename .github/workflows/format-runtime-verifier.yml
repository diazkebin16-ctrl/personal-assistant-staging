name: Format runtime verifier

on:
  push:
    branches:
      - ai3/fake-benchmark-runtime-canary

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai3/fake-benchmark-runtime-canary
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run ruff format scripts/verify_benchmark_runtime.py tests/unit/test_verify_benchmark_runtime.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify_benchmark_runtime.py tests/unit/test_verify_benchmark_runtime.py
          git commit -m "Format runtime benchmark verifier"
          git push origin HEAD:ai3/fake-benchmark-runtime-canary
