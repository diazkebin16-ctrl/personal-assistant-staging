name: Generate uv lock

on:
  workflow_dispatch:
  push:
    branches:
      - ai3/gemini-evaluation-candidate
    paths:
      - pyproject.toml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"

      - name: Generate lockfile
        run: uv lock

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
