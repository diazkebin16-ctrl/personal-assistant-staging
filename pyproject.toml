[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.13.0"
description = "Security-conscious foundation for a multi-device personal assistant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "openai>=1.100,<2.0",
  "PyJWT[crypto]>=2.13,<3.0",
  "pydantic>=2.13.5,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "SQLAlchemy[asyncio]>=2.0.36,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1.0",
  "httpx>=0.27,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=9.0.3,<10.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "shared*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
